name: Publish create-rango

# Publishes the version committed in packages/create-rango/package.json.
# Bump the version in a commit first; a re-publish of an existing version
# fails at npm. Auth is npm trusted publishing (id-token OIDC) — there is
# no token secret to rotate.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-create-rango
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: npm publish
        working-directory: packages/create-rango
